name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Android SDK and sdkmanager
        shell: bash
        run: |
          set -euxo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-}"

          if command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER_PATH="$(command -v sdkmanager)"
          elif [ -n "${ANDROID_SDK_ROOT:-}" ] && [ -x "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER_PATH="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          elif [ -n "${ANDROID_HOME:-}" ] && [ -x "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER_PATH="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          else
            SDKMANAGER_PATH="$(find /usr/local/lib/android -type f -name sdkmanager 2>/dev/null | head -n 1)"
          fi

          if [ -z "${SDKMANAGER_PATH}" ]; then
            echo "sdkmanager not found on runner" >&2
            exit 1
          fi

          echo "SDKMANAGER=${SDKMANAGER_PATH}" >> "$GITHUB_ENV"

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -euxo pipefail
          yes | "$SDKMANAGER" --licenses > /dev/null

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euxo pipefail
          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: 8.7

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: quran-follow-reader-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
